[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-itd"
version = "3.2.0"
description = "ATHENA ITD — AI-driven Insider Threat Detection platform (CLI + Web GUI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - All Rights Reserved (see LICENSE.md)" }
authors = [{ name = "Petro Plaku", email = "pplaku799@gmail.com" }]
keywords = ["security", "ueba", "insider-threat", "anomaly-detection", "soc", "siem"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "joblib>=1.3",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "platformdirs>=3.0",
    "python-dateutil>=2.8",
    "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/petroplaku/athena_itd_tool"
Documentation = "https://github.com/petroplaku/athena_itd_tool#readme"

[project.scripts]
athena = "athena_itd.cli:main"
athena-itd = "athena_itd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
athena_itd = ["web/templates/*.html", "web/static/*", "report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
    "ignore::DeprecationWarning:numpy.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Curated, meaningful ruleset: pyflakes/pycodestyle errors, import order,
# bugbears, comprehensions, and pyupgrade. Opinionated stylistic rules are left off.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "E702",   # compact `a; b` statements are a deliberate style in this codebase
    "B008",   # function call in argument default — this is FastAPI's Depends() pattern
    "B904",   # `raise ... from` is optional here; re-raises are already explicit
    "B905",   # `zip(strict=…)` not required for our fixed-length pairs
    "B007",   # unused loop var is intentional in a few enumerations
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # fixtures & re-imports are idiomatic in tests
